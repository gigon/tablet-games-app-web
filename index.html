<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#071a2b">
    <title>Tablet Games</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div id="game-title">Tablet games</div>
        <div id="status">Level 1</div>
      </header>
      <main id="stage" aria-live="polite"></main>
    </div>

    <div id="corner-zone" aria-hidden="true"></div>

    <div id="welcome" class="overlay">
      <div class="panel">
        <h1 id="welcome-title">Welcome</h1>
        <label id="name-label" class="field-label" for="name-input">What is your name?</label>
        <input
          id="name-input"
          class="big-input"
          type="text"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          maxlength="40"
          placeholder="Your name"
        >
        <button id="start-button" class="big-button primary" type="button">Start</button>
        <p id="hint" class="hint">Two fingers, held in a corner for two seconds, open the menu.</p>
      </div>
    </div>

    <div id="name-dialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="name-dialog-title">
      <div class="panel">
        <h1 id="name-dialog-title">Your name</h1>
        <input
          id="rename-input"
          class="big-input"
          type="text"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          maxlength="40"
          placeholder="Your name"
        >
        <button id="rename-save" class="big-button primary" type="button">Save</button>
        <button id="rename-cancel" class="big-button" type="button">Cancel</button>
      </div>
    </div>

    <div id="menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="panel menu-panel">
        <h1 id="menu-title">Menu</h1>
        <button id="menu-resume" class="big-button primary" type="button">Resume</button>
        <button id="menu-rename" class="big-button" type="button">Change name</button>
        <label id="language-label" class="field-label" for="menu-language">Language</label>
        <select id="menu-language" class="big-select">
          <option value="he">עברית</option>
          <option value="en">English</option>
        </select>
        <label id="gender-label" class="field-label" for="menu-gender">Gender</label>
        <select id="menu-gender" class="big-select">
          <option value="m">Masculine</option>
          <option value="f">Feminine</option>
        </select>
        <fieldset class="theme-fieldset">
          <legend id="themes-label" class="field-label">Themes</legend>
          <div id="menu-themes" class="theme-list"></div>
        </fieldset>
        <button id="menu-exit" class="big-button" type="button">Exit</button>
        <button id="menu-reset" class="big-button warning" type="button">Reset</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
